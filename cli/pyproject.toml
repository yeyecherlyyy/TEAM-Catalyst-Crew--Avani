[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghost_pm"]

[project]
name = "ghostpm"
version = "0.1.0"
description = "Headless CLI project manager for 24-hour hackathons"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Catalyst Crew" },
]

dependencies = [
    # CLI framework
    "click>=8.1",
    "rich>=13.0",
    
    # AI agent framework
    "pydantic>=2.0",
    "pydantic-ai>=0.1",
    
    # Supabase client
    "supabase>=2.0",
    
    # Git operations
    "gitpython>=3.1",
    
    # Code graph (graphify)
    "graphifyy>=0.1",
    
    # Background daemon
    "watchdog>=4.0",
    
    # Environment config
    "python-dotenv>=1.0",
    
    # TUI dashboard
    "textual>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ghostpm = "ghost_pm.cli:cli"

name: Feature Request
description: Suggest a new feature or enhancement for Ghost-PM.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Please describe your idea in detail so we can evaluate it.

  - type: dropdown
    id: module
    attributes:
      label: Target Module
      description: Which module would this feature affect?
      options:
        - Web Dashboard (Frontend)
        - Judge Agent (Python/Flask)
        - CLI / Terminal REPL
        - Background Daemon
        - API Routes
        - Database / Schema
        - New Module
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the problem this feature would solve. What limitation or pain point exists today?
      placeholder: I find it difficult to ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or approach.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and feature requests to avoid duplicates.
          required: true

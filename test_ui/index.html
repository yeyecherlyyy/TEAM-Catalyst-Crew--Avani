<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost-PM — Dashboard</title>
    <meta name="description" content="Ghost-PM dashboard for monitoring hackathon team progress and codebase health">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Connection Bar — Only Room ID needed -->
    <header id="connection-bar">
        <div class="connection-left">
            <span class="ghost-logo">👻</span>
            <h1>Ghost-PM</h1>
            <span class="badge" id="connection-status">Disconnected</span>
        </div>
        <div class="connection-right">
            <input type="text" id="room-id" placeholder="Enter Room ID (e.g. umk-fvn-dcb)" autocomplete="off">
            <button id="connect-btn" onclick="connectToRoom()">Connect</button>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main id="dashboard" class="hidden">
        <!-- Room Header -->
        <section id="room-header">
            <div class="room-info">
                <h2 id="room-name">—</h2>
                <p id="room-description">—</p>
                <div class="room-meta">
                    <span class="tag" id="room-tech-stack"></span>
                    <span class="timer" id="time-remaining">—</span>
                </div>
            </div>
            <div id="panic-indicator" class="panic-off">
                <span class="panic-dot"></span>
                <span id="panic-text">Normal Mode</span>
            </div>
        </section>

        <!-- Grid Layout -->
        <div class="dashboard-grid">
            <!-- Milestones Panel -->
            <section class="panel" id="milestones-panel">
                <div class="panel-header">
                    <h3>📊 Milestones</h3>
                    <span class="panel-count" id="milestone-count">0</span>
                </div>
                <div class="panel-body" id="milestones-list">
                    <div class="empty-state">No milestones yet</div>
                </div>
            </section>

            <!-- Team Activity Panel -->
            <section class="panel" id="team-panel">
                <div class="panel-header">
                    <h3>👥 Team Activity</h3>
                    <span class="panel-count" id="member-count">0 online</span>
                </div>
                <div class="panel-body" id="team-list">
                    <div class="empty-state">No members connected</div>
                </div>
            </section>

            <!-- Code Graph Panel -->
            <section class="panel" id="graph-panel">
                <div class="panel-header">
                    <h3>🔗 Code Graph</h3>
                    <span class="panel-count" id="graph-timestamp">—</span>
                </div>
                <div class="panel-body">
                    <div class="graph-stats" id="graph-stats">
                        <div class="stat-card">
                            <span class="stat-value" id="stat-nodes">0</span>
                            <span class="stat-label">Nodes</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="stat-edges">0</span>
                            <span class="stat-label">Edges</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="stat-functions">0</span>
                            <span class="stat-label">Functions</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="stat-files">0</span>
                            <span class="stat-label">Files</span>
                        </div>
                    </div>
                    <div class="function-status-bar" id="function-status-bar"></div>
                    <div class="status-legend" id="status-legend"></div>
                    <div id="god-nodes-list"></div>
                    <div id="communities-list"></div>
                </div>
            </section>

            <!-- Commits Feed Panel -->
            <section class="panel" id="commits-panel">
                <div class="panel-header">
                    <h3>📝 Recent Commits</h3>
                    <span class="panel-count" id="commit-count">0</span>
                </div>
                <div class="panel-body scrollable" id="commits-list">
                    <div class="empty-state">No commits recorded</div>
                </div>
            </section>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
